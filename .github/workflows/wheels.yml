name: Build & Publish Python Package

on:
  release:
    types: [created]
    # Only trigger for regular releases, not pre-releases
    # See https://docs.github.com/en/actions/reference/events-that-trigger-workflows#release
    # for more information on the release event
    prerelease: false
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # 1.a Build the wheels on a matrix of Windows, macOS, and Linux platforms using cibuildwheel
  #     Builds CPython (incl. free-threaded 3.14t+) and PyPy wheels
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux: x86_64 and aarch64 wheels (manylinux & musllinux) are built natively on the respective runner
        # macOS: The arm64 runner builds arm64 wheels and cross-compiles the x86_64 wheels with Apple Clang
        # Windows: x86_64 and ARM64 wheels are built natively with MSVC on the respective runner
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      # Set up the Visual Studio environment on Windows (required, so that CMake finds the compiler)
      # The toolchain's target architecture must match the runner's architecture
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        if: runner.os == 'Windows'
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BEFORE_BUILD: pipx install ninja cmake
          CIBW_ENABLE: pypy
          CIBW_ARCHS: auto64
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # For x86_64, we need at least macOS 10.15 (released 2019) for C++17 support
          # (arm64 wheels automatically target macOS 11.0 or newer)
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="10.15"'
          CIBW_TEST_COMMAND: 'python -c "import polyhedral_gravity"'
        with:
          package-dir: .
          output-dir: dist
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-wheels-${{ matrix.os }}
          path: dist/*.whl

  # 1.b Build the source distribution by simply running the build command
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-sdist
          path: dist/*.tar.gz

  # 2. Upload the wheels and the source distribution to testpypi
  #    using trusted publishing
  upload_testpypi:
    needs: [build_wheels, make_sdist]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/polyhedral-gravity
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # 3. Upload the wheels to the actually Python Package Index
  #    using trusted publishing
  upload_pypi:
    needs: [build_wheels, make_sdist, upload_testpypi]
    environment:
      name: pypi
      url: https://pypi.org/p/polyhedral-gravity
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
